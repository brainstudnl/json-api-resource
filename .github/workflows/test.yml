name: test

on:
  pull_request:
    branches:
      - "main"
      - "development"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        laravel: [10.*, 11.*, 12.*]
        include:
          - laravel: 10.*
            testbench: ^8.0
            phpunit: ^10.0
          - laravel: 11.*
            testbench: ^9.0
            phpunit: ^10.5
          - laravel: 12.*
            testbench: ^10.0
            phpunit: ^11.0
        exclude:
          # Laravel 10 doesn't support PHP 8.4
          - php: 8.4
            laravel: 10.*
          # Only Laravel 12 supports PHP 8.5
          - php: 8.5
            laravel: 10.*
          - php: 8.5
            laravel: 11.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v3

      - uses: php-actions/composer@v6
        with:
          php_version: "8.5"

      - name: PHPUnit Tests
        uses: php-actions/phpunit@master
        with:
          version: 11
          php_version: "8.5"
          bootstrap: vendor/autoload.php
          configuration: ./phpunit.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: "laravel-pint"
        uses: aglipanci/laravel-pint-action@2.0.0
        with:
          preset: laravel
          verboseMode: true
          testMode: true
          onlyDirty: true
